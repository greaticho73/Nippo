name: Build Catatan Nippo APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CatatanNippo_Android_GitHub_Build.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f CatatanNippo_Android_GitHub_Build.zip
          rm -rf CatatanNippo_Android
          unzip -oq CatatanNippo_Android_GitHub_Build.zip
          test -f CatatanNippo_Android/settings.gradle
          test -f CatatanNippo_Android/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Gradle version
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          test "$(gradle --version | grep -m1 '^Gradle ' | awk '{print $2}')" = "8.11.1"

      - name: Build Debug APK
        working-directory: CatatanNippo_Android
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK
        working-directory: CatatanNippo_Android
        run: gradle assembleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Catatan-Nippo-debug-apk
          path: CatatanNippo_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Catatan-Nippo-release-apk
          path: CatatanNippo_Android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
