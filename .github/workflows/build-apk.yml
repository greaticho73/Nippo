name: Build Catatan Nippo APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CatatanNippo_Android_GitHub_Build.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f CatatanNippo_Android_GitHub_Build.zip
          rm -rf CatatanNippo_Android
          unzip -oq CatatanNippo_Android_GitHub_Build.zip
          test -f CatatanNippo_Android/settings.gradle
          test -f CatatanNippo_Android/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Java version ==="
          java -version

          echo "=== Gradle version ==="
          gradle --version

          GRADLE_VERSION="$(gradle --version | grep -m1 '^Gradle ' | awk '{print $2}')"

          if [ "$GRADLE_VERSION" != "8.11.1" ]; then
            echo "ERROR: Expected Gradle 8.11.1, but found $GRADLE_VERSION"
            exit 1
          fi

      - name: Build Debug APK
        working-directory: CatatanNippo_Android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        working-directory: CatatanNippo_Android
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK files
        shell: bash
        run: |
          set -euo pipefail

          DEBUG_APK="CatatanNippo_Android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="CatatanNippo_Android/app/build/outputs/apk/release/app-release.apk"

          echo "=== Checking Debug APK ==="
          test -f "$DEBUG_APK"
          ls -lh "$DEBUG_APK"

          echo "=== Checking Release APK ==="
          test -f "$RELEASE_APK"
          ls -lh "$RELEASE_APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Catatan-Nippo-debug-apk
          path: CatatanNippo_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Catatan-Nippo-release-apk
          path: CatatanNippo_Android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
